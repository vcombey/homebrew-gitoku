name: Sync rgh Formula

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest hosted formula
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Formula
          tmp_file="$(mktemp)"
          if ! curl -fsSL https://gitoku.live/rgh/homebrew/rgh.rb -o "$tmp_file"; then
            echo "Hosted formula unavailable; skipping sync."
            exit 0
          fi
          mv "$tmp_file" Formula/rgh.rb

      - name: Commit formula changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/rgh.rb; then
            echo "No formula changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/rgh.rb
          git commit -m "Sync rgh formula"
          git push
